name: Publish Stage 0 test page

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v5
      - name: Configure test endpoint
        env:
          APPS_SCRIPT_URL: ${{ vars.STAGE0_APPS_SCRIPT_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.STAGE0_GOOGLE_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const apps_script_url = process.env.APPS_SCRIPT_URL;
          const google_client_id = process.env.GOOGLE_CLIENT_ID;
          if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(apps_script_url) ||
              !/^[\w-]+\.apps\.googleusercontent\.com$/.test(google_client_id)) {
            throw new Error('Configure STAGE0_APPS_SCRIPT_URL and STAGE0_GOOGLE_CLIENT_ID in repository variables.');
          }
          fs.cpSync('stage0/pages', 'dist/stage0', { recursive: true });
          const config = JSON.stringify({apps_script_url, google_client_id});
          fs.writeFileSync('dist/config.json', config);
          fs.writeFileSync('dist/stage0/config.json', config);
          NODE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
