name: Check LPJ contracts and build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Jalankan pengujian otomatis
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - if: github.event_name == 'workflow_dispatch' && inputs.run_tests
        run: pnpm test
      - run: pnpm build
